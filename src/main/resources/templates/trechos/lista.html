
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Trechos</title>
</head>
<body>

<h1>Cidade em Dia de Chuva</h1>
<h2>Lista de Trechos</h2>

<p th:text="${mensagem}"></p>
<p th:text="${erro}"></p>

<a th:href="@{/trechos/novo}">Cadastrar Trecho</a>

<br><br>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Logradouro</th>
        <th>Tipo de Calçada</th>
        <th>Altitude (m)</th>
        <th>Bairro</th>
        <th>Ações</th>
    </tr>

    <tr th:each="trecho : ${trechos}">
        <td th:text="${trecho.id}"></td>
        <td th:text="${trecho.logradouro}"></td>
        <td th:text="${trecho.tipoCalcada}"></td>
        <td th:text="${trecho.altitude}"></td>
        <td th:text="${trecho.bairroNome}"></td>

        <td>
            <a th:href="@{/trechos/editar/{id}(id=${trecho.id})}">
                Editar
            </a>

            <form th:action="@{/trechos/excluir/{id}(id=${trecho.id})}"
                  method="post">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>

<br>

<a th:href="@{/bairros}">Voltar para Bairros</a>

</body>
</html>
