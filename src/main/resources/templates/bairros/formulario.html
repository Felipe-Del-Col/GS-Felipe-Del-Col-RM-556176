<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Bairro</title>
</head>
<body>

<h1>Cadastro de Bairro</h1>

<form th:action="@{/bairros/salvar}"
      th:object="${bairro}" method="post">

    <input type="hidden" th:field="*{id}">

    <label>Nome:</label>
    <input type="text" th:field="*{nome}" required>

    <br><br>

    <label>Zona:</label>
    <select th:field="*{zona}" required>
        <option value="">Selecione</option>
        <option value="Centro">Centro</option>
        <option value="Norte">Norte</option>
        <option value="Sul">Sul</option>
        <option value="Leste">Leste</option>
        <option value="Oeste">Oeste</option>
    </select>

    <br><br>

    <label>Area (km2):</label>
    <input type="number" th:field="*{areaKm2}"
           step="0.01" min="0.01" required>

    <br><br>

    <button type="submit">Salvar</button>

</form>

<br>

<a th:href="@{/bairros}">Voltar</a>

</body>
</html>
