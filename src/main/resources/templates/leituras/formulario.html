<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Leitura</title>
</head>

<body>

<h1>Cidade em Dia de Chuva</h1>

<h2>Cadastro e Edição de Leitura</h2>


<p th:if="${erro != null}"
   th:text="${erro}">
</p>


<form th:action="@{/leituras/salvar}"
      th:object="${leitura}"
      method="post">


    <input type="hidden" th:field="*{id}">


    <label>Trecho:</label>

    <select th:field="*{trechoId}" required>

        <option value="">Selecione</option>

        <option th:each="trecho : ${trechos}"
                th:value="${trecho.id}"
                th:text="${trecho.logradouro + ' (' + trecho.bairroNome + ')'}">
        </option>

    </select>

    <p th:if="${#fields.hasErrors('trechoId')}"
       th:errors="*{trechoId}">
    </p>

    <br>


    <label>Data e Hora:</label>

    <input type="datetime-local"
           th:field="*{dataHora}"
           required>

    <p th:if="${#fields.hasErrors('dataHora')}"
       th:errors="*{dataHora}">
    </p>

    <br>


    <label>Lâmina d'água (cm):</label>

    <input type="number"
           th:field="*{laminaCm}"
           min="0"
           max="300"
           required>

    <p th:if="${#fields.hasErrors('laminaCm')}"
       th:errors="*{laminaCm}">
    </p>

    <br>


    <button type="submit">
        Salvar
    </button>

</form>

<br>

<a th:href="@{/leituras}">
    Voltar para Leituras
</a>

</body>
</html>
