<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Leitura</title>
</head>
<body>

<h1>Cadastro de Leitura</h1>

<form th:action="@{/leituras/salvar}"
      th:object="${leitura}" method="post">

    <input type="hidden" th:field="*{id}">

    <label>Data e Hora:</label>
    <input type="datetime-local"
           th:field="*{dataHora}" required>

    <br><br>

    <label>Nivel da Agua (cm):</label>
    <input type="number"
           th:field="*{laminaCm}"
           min="0" max="300" required>

    <br><br>

    <label>Trecho:</label>
    <select th:field="*{trechoId}" required>
        <option value="">Selecione</option>

        <option th:each="trecho : ${trechos}"
                th:value="${trecho.id}"
                th:text="${trecho.logradouro}">
        </option>
    </select>

    <br><br>

    <button type="submit">Salvar</button>

</form>

<br>

<a th:href="@{/leituras}">Voltar</a>

</body>
</html>
